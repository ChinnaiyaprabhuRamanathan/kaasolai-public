<aside class="sidebar" id="sidebar" aria-label="Sidebar">
  <a class="brand" href="/" aria-label="kaasolai.in — home">
    <span class="brand-name">kaasolai.in</span>
  </a>

  <nav class="nav" aria-label="Main">
    <ul>
      {% assign nav_items = site.data.navigation | sort: "order" %}
      {% for item in nav_items %}
      <li>
        <a href="{{ item.url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </nav>

  <div class="sidebar-footer">
    {% include theme-toggle.html %}
  </div>
</aside>
