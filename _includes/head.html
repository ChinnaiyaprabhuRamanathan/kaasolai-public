<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://www.youtube-nocookie.com">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">

<title>{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">

{% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
{% if page.noindex %}
<link rel="canonical" href="{{ site.url }}/">
{% else %}
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
{% endif %}

<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:type" content="{% if page.url == '/' %}website{% else %}article{% endif %}">
<meta property="og:title" content="{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta property="og:url" content="{% if page.noindex %}{{ site.url }}{% else %}{{ site.url }}{{ page.url }}{% endif %}">
<meta property="og:image" content="{{ site.url }}/assets/images/og-default.jpg">
<meta property="og:image:alt" content="{{ site.title }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta name="twitter:image" content="{{ site.url }}/assets/images/og-default.jpg">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/theme-init.js"></script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}/",
      "name": "{{ site.title }}",
      "description": "{{ site.description | strip_newlines | escape }}",
      "inLanguage": "en"
    },
    {
      "@type": "Organization",
      "@id": "{{ site.url }}/#organization",
      "url": "{{ site.url }}/",
      "name": "{{ site.title }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ site.url }}/assets/images/apple-touch-icon.png",
        "width": 180,
        "height": 180
      }
    }
  ]
}
</script>

{% unless page.url == '/' or page.noindex %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebPage",
      "@id": "{{ site.url }}{{ page.url }}#webpage",
      "url": "{{ site.url }}{{ page.url }}",
      "name": "{{ page.title | escape }}",
      "isPartOf": { "@id": "{{ site.url }}/#website" },
      "dateModified": "{{ page.last_modified | date_to_xmlschema }}",
      "inLanguage": "en"
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ site.url }}{{ page.url }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "{{ site.url }}/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "{{ page.title | escape }}",
          "item": "{{ site.url }}{{ page.url }}"
        }
      ]
    }
  ]
}
</script>
{% endunless %}
